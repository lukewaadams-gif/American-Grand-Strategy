<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandate</title>
<meta name="description" content="Mandate, an American political strategy game: win the 2028 election, take the oath, and govern your first hundred days. Plays in the browser; saves stay in your browser.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A1020'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-weight='700' font-size='20' text-anchor='middle' fill='%23F2B84B'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <div class="loading" role="status">
    <div class="loading-mark">Mandate</div>
    <div class="loading-text">Loading the game…</div>
  </div>
</div>
<noscript><p class="noscript">Mandate runs in your browser and needs JavaScript turned on.</p></noscript>
<script src="js/mandate.js"></script>
<script>
  try {
    main([]);
  } catch (e) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="loading" role="alert"><div class="loading-mark">Mandate</div>'
      + '<div class="loading-text">The game could not start in this browser. Try a current version of Chrome, Edge, Firefox or Safari.</div></div>';
    console.error(e);
  }
</script>
</body>
</html>
