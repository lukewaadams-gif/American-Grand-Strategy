[package]
name = "ags-sim"
version = "0.1.0"
edition = "2021"
description = "American Grand Strategy: the deterministic simulation, native for tests and WebAssembly for the browser."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
